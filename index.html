  const Typewriter = ({ texts, delay = 120, loopDelay = 2000 }) => {
    const [displayText, setDisplayText] = useState("");
    const [index, setIndex] = useState(0);
    const [charIndex, setCharIndex] = useState(0);
    const [isDeleting, setIsDeleting] = useState(false);
    useEffect(() => {
      const timeout = setTimeout(() => {
        const current = texts[index];
        if (!isDeleting && charIndex <= current.length) {
          setDisplayText(current.slice(0, charIndex + 1));
          setCharIndex(charIndex + 1);
          if (charIndex === current.length) setTimeout(() => setIsDeleting(true), loopDelay);
        } else if (isDeleting && charIndex > 0) {
          setDisplayText(current.slice(0, charIndex - 1));
          setCharIndex(charIndex - 1);
        } else if (isDeleting && charIndex === 0) {
          setIsDeleting(false);
          setIndex((prev) => (prev + 1) % texts.length);
        }
      }, isDeleting ? 50 : delay);
      return () => clearTimeout(timeout);
    }, [charIndex, isDeleting, index, texts, delay, loopDelay]);
    return <span>{displayText}<span className="typed-cursor"> </span></span>;
  };

            <div className="inline-flex items-center gap-2 px-4 py-1.5 rounded-full bg-red-950/40 border border-red-500/40 text-red-300 text-xs font-mono backdrop-blur-sm mb-5"><span className="relative flex h-2 w-2"><span className="animate-ping absolute h-2 w-2 rounded-full bg-red-500"></span><span className="relative rounded-full h-2 w-2 bg-red-500"></span></span>{t.badge}</div>
            <h1 className="text-5xl md:text-7xl font-extrabold tracking-tight"><span className="text-white">Camilo </span><span className="bg-gradient-to-r from-red-500 to-red-700 bg-clip-text text-transparent">Caballero</span></h1>
            <div className="text-2xl md:text-3xl font-medium mt-4 flex flex-wrap gap-2 items-center justify-center lg:justify-start"><span className="text-gray-300">🚀</span><Typewriter texts={t.roles} delay={100} loopDelay={1800} /></div>
            <p className="text-gray-400 max-w-xl mt-6 text-lg leading-relaxed">{t.description}<span className="block text-sm text-red-400/80 mt-2">#CabDevX — {t.tagline}</span></p>
            <div className="flex flex-wrap gap-5 mt-9 justify-center lg:justify-start"><a href={`#${language === 'es' ? 'contacto' : 'contact'}`} className="px-8 py-3.5 rounded-full bg-red-600 hover:bg-red-700 transition-all shadow-xl shadow-red-900/50 font-semibold text-sm tracking-wide flex items-center gap-2"><i className="fas fa-paper-plane"></i> {t.contactBtn}</a><a href={`#${language === 'es' ? 'proyectos' : 'projects'}`} className="px-8 py-3.5 rounded-full border border-gray-600 hover:border-red-500 hover:bg-red-500/10 transition-all flex items-center gap-2"><i className="fas fa-rocket"></i> {t.projectsBtn}</a></div>
          </div>
          <div className="flex-1 flex justify-center"><div className="relative w-72 h-72 md:w-88 md:h-88 lg:w-96 lg:h-96 rounded-full bg-gradient-to-br from-red-700 via-black to-red-900 p-1.5 shadow-2xl shadow-red-600/30 profile-img"><div className="w-full h-full rounded-full overflow-hidden border-4 border-black/80 bg-gradient-to-b from-gray-900 to-black flex items-center justify-center"><img src="https://i.imgur.com/kzKr9K8.jpeg" alt="Camilo Caballero" className="w-full h-full object-cover scale-105 transition-all duration-500 hover:scale-110" onError={(e) => { e.target.src = 'https://via.placeholder.com/400x400/1a1a2e/ef4444?text=CabDevX'; }}/></div><div className="absolute -bottom-3 -right-3 bg-red-600 w-10 h-10 rounded-full border-2 border-black flex items-center justify-center text-white shadow-md animate-pulse"><i className="fas fa-code text-sm"></i></div></div></div>
        </div>
        <div className="absolute bottom-8 left-1/2 -translate-x-1/2 animate-bounce opacity-60"><i className="fas fa-angle-double-down text-2xl text-red-400"></i></div>
      </section>
    );
  };

  const About = () => {
    const { language } = React.useContext(LanguageContext);
    const t = translations[language].about;
    return (
      <section id={language === 'es' ? "sobre-mi" : "about"} className="py-24 px-6 bg-gradient-to-b from-black via-gray-950 to-black">
        <div className="max-w-7xl mx-auto">
          <div className="text-center mb-14"><h2 className="text-4xl md:text-5xl font-bold bg-gradient-to-r from-gray-200 to-red-400 bg-clip-text text-transparent">{t.title}</h2><div className="w-24 h-1 bg-red-600 mx-auto mt-3 rounded-full"></div></div>
          <div className="flex flex-col lg:flex-row gap-12">
            <div className="flex-1 space-y-5"><p className="text-gray-300 text-lg leading-relaxed" dangerouslySetInnerHTML={{ __html: t.description1 }}></p><p className="text-gray-400" dangerouslySetInnerHTML={{ __html: t.description2 }}></p><div className="grid grid-cols-2 gap-3 pt-3">{t.qualities.map((item,i)=> <div key={i} className="flex items-center gap-2 text-sm"><i className="fas fa-bolt text-red-500 text-xs"></i><span>{item}</span></div>)}</div></div>
            <div className="flex-1 glass-card p-6 md:p-8"><h3 className="text-2xl font-bold mb-5 flex gap-2"><i className="fab fa-react text-red-400"></i> {t.techTitle}</h3><div className="grid grid-cols-3 sm:grid-cols-4 md:grid-cols-5 gap-5">{coreSkills.map((skill,idx) => <div key={idx} className="skill-icon flex flex-col items-center gap-1.5 group cursor-default"><i className={`${skill.icon} text-3xl md:text-4xl`} style={{ color: skill.color, textShadow: "0 0 6px rgba(0,0,0,0.5)" }}></i><span className="text-[11px] font-mono text-gray-400 text-center">{skill.name}</span></div>)}</div><div className="mt-6 text-xs text-gray-500 border-t border-gray-800 pt-4 flex justify-between"><span><i className="fas fa-database text-red-400"></i> {t.databases}</span><span><i className="fab fa-github"></i> {t.versionControl}</span></div></div>
          </div>
        </div>
      </section>
    );
  };

  const Projects = () => {
    const { language } = React.useContext(LanguageContext);
    const projects = proyectosData[language];
    const t = translations[language].projects;
    return (
      <section id={language === 'es' ? "proyectos" : "projects"} className="py-24 px-6 bg-black">
        <div className="max-w-7xl mx-auto">
          <div className="text-center mb-14">
            <h2 className="text-4xl md:text-5xl font-bold bg-gradient-to-r from-red-400 to-white bg-clip-text text-transparent">{t.title}</h2>
            <p className="text-gray-400 mt-3">{t.subtitle}</p>
          </div>
          <div className="grid md:grid-cols-2 lg:grid-cols-3 gap-8">
            {projects.map(proj => (
              <div key={proj.id} className="glass-card overflow-hidden group flex flex-col h-full rounded-2xl transition-all duration-500">
                <div className="h-48 overflow-hidden relative bg-gray-900">
                  <img src={proj.imagen} alt={proj.titulo} className="project-img" loading="lazy" />
                  <div className="absolute inset-0 bg-gradient-to-t from-black/60 via-transparent to-transparent opacity-0 group-hover:opacity-100 transition"></div>
                </div>
                <div className="p-5 flex-1 flex flex-col">
                  <h3 className="text-xl font-bold tracking-tight">{proj.titulo}</h3>
                  <div className="flex flex-wrap gap-1.5 my-2">
                    {proj.tags.slice(0, 4).map(tag => <span key={tag} className="text-[8px] uppercase bg-red-950/40 px-1.5 py-0.5 rounded-full text-red-300">{tag}</span>)}
                    {proj.tags.length > 4 && <span className="text-[8px] uppercase bg-gray-800 px-1.5 py-0.5 rounded-full text-gray-400">+{proj.tags.length - 4}</span>}
                  </div>
                  <p className="text-gray-400 text-xs my-2 flex-1 line-clamp-3">{proj.descripcion}</p>
                  <a href={proj.url} target="_blank" rel="noopener noreferrer" className="project-btn mt-2 flex items-center justify-center gap-2 py-2 rounded-xl text-white font-medium text-sm transition-all">
                    <i className="fas fa-external-link-alt"></i> {t.viewBtn}
                  </a>
                </div>
              </div>
            ))}
          </div>
        </div>
      </section>
    );
  };

  const Services = () => {
    const { language } = React.useContext(LanguageContext);
    const t = translations[language].services;
    return (
      <section id="servicios" className="py-24 px-6 bg-gradient-to-b from-gray-950 to-black">
        <div className="max-w-7xl mx-auto">
          <div className="text-center mb-14">
            <h2 className="text-4xl md:text-5xl font-bold text-white">{t.title} <span className="text-red-500">Premium</span></h2>
            <p className="text-gray-400">{t.subtitle}</p>
          </div>
          <div className="grid sm:grid-cols-2 lg:grid-cols-3 gap-6">
            {t.items.map((s,i)=> (
              <div key={i} className="text-center p-7 rounded-2xl bg-gray-900/30 border border-gray-800 hover:border-red-500/60 transition-all duration-300 hover:shadow-2xl hover:shadow-red-500/10 backdrop-blur-sm">
                <i className={`${s.icon} text-4xl text-red-500 mb-4`}></i>
                <h3 className="text-xl font-bold mb-2">{s.title}</h3>
                <p className="text-gray-400 text-sm">{s.desc}</p>
              </div>
            ))}
          </div>
        </div>
      </section>
    );
  };

  const Contact = () => {
    const { language } = React.useContext(LanguageContext);
    const t = translations[language].contact;
    const cv = cvUrls[language];
    
    const contactItems = [
      { name:"WhatsApp", icon:"fab fa-whatsapp", url:"https://wa.me/573238849203", color:"bg-green-700" },
      { name:"GitHub", icon:"fab fa-github", url:"https://github.com/Camilo-JC", color:"bg-gray-800" },
      { name:"LinkedIn", icon:"fab fa-linkedin-in", url:"https://www.linkedin.com/in/camilo-caballero-061252407", color:"bg-blue-800" },
      { name:"Email", icon:"fas fa-envelope", url:"mailto:camilojc1725@gmail.com", color:"bg-red-700" },
    ];
    
    const handleViewCV = () => { window.open(cv.view, "_blank"); };
    const handleDownloadCV = () => { window.open(cv.download, "_blank"); };
    
    useEffect(() => {
      const script = document.createElement('script');
      script.src = "https://unpkg.com/@formspree/ajax@1";
      script.defer = true;
      script.onload = () => { if (window.formspree) { window.formspree('initForm', { formElement: '#fs-form', formId: 'xeenapwr' }); } };
      document.body.appendChild(script);
      return () => { if (document.body.contains(script)) document.body.removeChild(script); };
    }, []);
    
    return (
      <section id={language === 'es' ? "contacto" : "contact"} className="py-24 px-6 bg-black relative">
        <div className="max-w-6xl mx-auto">
          <div className="text-center mb-14">
            <h2 className="text-4xl md:text-5xl font-bold">{t.title} <span className="text-red-500">CabDevX</span></h2>
            <div className="w-24 h-1 bg-red-600 mx-auto mt-3 rounded-full"></div>
          </div>
          <div className="grid md:grid-cols-2 gap-12">
            <div className="glass-card p-8">
              <h3 className="text-2xl font-semibold mb-5"><i className="fas fa-comment-dots text-red-500 mr-2"></i> {t.formTitle}</h3>
              <form id="fs-form" className="space-y-5">
                <input type="text" name="name" placeholder={t.namePlaceholder} data-fs-field className="w-full px-5 py-3 rounded-xl bg-gray-900 text-white" required />
                <input type="email" name="email" placeholder={t.emailPlaceholder} data-fs-field className="w-full px-5 py-3 rounded-xl bg-gray-900 text-white" required />
                <textarea name="message" rows="3" placeholder={t.messagePlaceholder} data-fs-field className="w-full px-5 py-3 rounded-xl bg-gray-900 resize-none" required></textarea>
                <div data-fs-success className="text-green-400 text-sm mt-2 hidden">{t.successMessage}</div>
                <div data-fs-error className="text-red-400 text-sm mt-2 hidden">{t.errorMessage}</div>
                <button type="submit" data-fs-submit-btn className="bg-red-600 hover:bg-red-700 py-3 rounded-xl w-full font-bold transition shadow-lg">
                  <i className="fas fa-paper-plane mr-2"></i>{t.sendButton}
                </button>
              </form>
            </div>
            <div className="space-y-7">
              <div className="glass-card p-8">
                <h3 className="text-xl font-bold mb-5">{t.directChannels}</h3>
                <div className="flex flex-wrap gap-3 justify-center md:justify-start">
                  {contactItems.map((item,i)=> (
                    <a key={i} href={item.url} target="_blank" rel="noopener noreferrer" className={`flex items-center gap-2 px-5 py-3 rounded-xl ${item.color} hover:opacity-80 transition-all border border-white/20 shadow-lg`}>
                      <i className={`${item.icon} text-xl`}></i>
                      <span className="text-sm font-medium">{item.name}</span>
                    </a>
                  ))}
                </div>
                <div className="mt-8 pt-5 border-t border-white/10 text-center">
                  <div className="cv-buttons">
                    <button onClick={handleViewCV} className="cv-btn cv-view"><i className="fas fa-eye"></i> {t.viewCV}</button>
                    <button onClick={handleDownloadCV} className="cv-btn cv-download"><i className="fas fa-download"></i> {t.downloadCV}</button>
                  </div>
                </div>
              </div>
              <div className="bg-gray-950/40 p-5 rounded-2xl border border-red-800/30 text-center backdrop-blur-sm">
                <i className="fas fa-map-pin text-red-500 text-xl"></i>
                <p className="text-gray-300 text-lg font-medium mt-1">Barranquilla, Colombia</p>
              </div>
            </div>
          </div>
        </div>
      </section>
    );
  };

  const Footer = () => {
    const { language } = React.useContext(LanguageContext);
    return (
      <footer className="border-t border-red-900/40 py-8 bg-black/90">
        <div className="max-w-7xl mx-auto text-center px-6">
          <p className="text-gray-500 text-sm tracking-wide">{translations[language].footer}</p>
        </div>
      </footer>
    );
  };

  const App = () => {
    const [activeSection, setActiveSection] = useState("inicio");
    const [language, setLanguage] = useState("es");
    useEffect(() => {
      const observer = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
          if (entry.isIntersecting) setActiveSection(entry.target.id);
        });
      }, { threshold: 0.4, rootMargin: "-70px 0px -20% 0px" });
      const sections = language === 'es' ? ["inicio","sobre-mi","proyectos","servicios","contacto"] : ["home","about","projects","services","contact"];
      sections.forEach(id => {
        const el = document.getElementById(id);
        if(el) observer.observe(el);
      });
      return () => observer.disconnect();
    }, [language]);
    return (
      <LanguageContext.Provider value={{ language, setLanguage }}>
        <div className="bg-black">
          <Navigation activeSection={activeSection} setActiveSection={setActiveSection} language={language} setLanguage={setLanguage} />
          <Hero />
          <About />
          <Projects />
          <Services />
          <Contact />
          <Footer />
        </div>
      </LanguageContext.Provider>
    );
  };
  
  ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
